<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  style="padding: 8px 4px; max-width: 640px"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })">
  <groupbox style="margin: 0 0 16px">
    <label>
      <html:h2 style="margin: 0 0 10px; font-size: 16px" data-l10n-id="pref-title"></html:h2>
    </label>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-authkey"
        style="min-width: 72px"
        data-l10n-id="pref-authkey"></html:label>
      <html:input
        type="password"
        autocomplete="off"
        placeholder="pt_..."
        style="width: 220px; min-width: 160px; flex: 1"
        id="zotero-prefpane-__addonRef__-authkey"></html:input>
      <button
        id="zotero-prefpane-__addonRef__-test-button"
        style="width: 72px; min-width: 72px; margin-inline-start: 8px; margin-inline-end: 0"
        data-l10n-id="pref-test-button"></button>
      <button
        id="putongdoc-token-remove"
        style="width: 72px; min-width: 72px; margin-inline-start: 8px; margin-inline-end: 0"
        data-l10n-id="pref-token-remove"></button>
    </hbox>
    <hbox align="center" style="margin-top: 6px">
      <description
        id="putongdoc-token-feedback"
        flex="1"
        style="margin: 0"
        data-l10n-id="pref-token-help"></description>
      <label
        is="zotero-text-link"
        class="zotero-text-link"
        href="https://putongdoc.com/tokens"
        data-l10n-id="pref-token-create"></label>
    </hbox>
  </groupbox>
  <groupbox style="margin: 0">
    <label>
      <html:h2
        style="margin: 0 0 10px; font-size: 16px"
        data-l10n-id="pref-translate-settings"></html:h2>
    </label>
    <hbox align="center" style="margin-bottom: 8px">
      <label style="width: 160px; margin: 0" data-l10n-id="pref-target-language"></label>
      <box id="__addonRef__-target-language-placeholder"></box>
    </hbox>
    <hbox align="center" style="margin-bottom: 8px">
      <label style="width: 160px; margin: 0" data-l10n-id="pref-translate-mode"></label>
      <box id="__addonRef__-translate-mode-placeholder"></box>
    </hbox>
    <hbox align="center" style="margin-bottom: 8px">
      <label style="width: 160px; margin: 0" data-l10n-id="pref-extract-backend"></label>
      <box id="__addonRef__-extract-backend-placeholder"></box>
    </hbox>
    <checkbox native="true" preference="autoOpenPDF" data-l10n-id="pref-enable-autoOpenPDF" />
  </groupbox>
  <hbox align="center" style="margin-top: 16px">
    <label
      data-l10n-id="pref-about-version"
      data-l10n-args='{"time": "__buildTime__","version":"__buildVersion__"}'></label>
    <spacer flex="1" />
    <label
      data-l10n-id="pref-about-feedback"
      hidden="true"
      is="zotero-text-link"
      class="zotero-text-link"
      href="https://github.com/lemos1235/zotero-putongdoc/issues"></label>
  </hbox>
</vbox>
